<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Vehículos</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="app-shell">
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <main class="page">
        <section class="hero">
            <div class="hero-text">
                <p class="eyebrow">Vehículos</p>
                <h1>Listado de vehículos</h1>
                <p>Lista de vehículos disponibles en el sistema.</p>
            </div>
            <div class="hero-actions">
                <a class="facv-btn-primary" th:href="@{/nuevo-vehiculo}">+ Añadir vehículo</a>
            </div>
        </section>

        <form method="post" th:action="@{/findByMarca}" th:object="${searchForm}">
            <div class="facv-search-bar">
                <div class="facv-search-input-group">
                    <label class="facv-search-label">Buscar por marca</label>
                    <input type="text" class="facv-input" th:field="*{marca}" placeholder="Marca del vehículo...">
                </div>
                <div class="facv-search-actions">
                    <button type="submit" class="facv-btn-primary">Buscar</button>
                    <a class="facv-btn-neutral" th:href="@{/vehiculos}">Limpiar</a>
                </div>
            </div>
        </form>

        <div th:if="${#lists.isEmpty(vehiculos)}" class="card panel">
            <p>No hay vehículos aún.</p>
        </div>

        <div class="facv-table-wrapper" th:unless="${#lists.isEmpty(vehiculos)}">
            <table class="facv-table">
                <thead>
                    <tr>
                        <th>Matrícula</th>
                        <th>Marca</th>
                        <th>Modelo</th>
                        <th>Categoría</th>
                        <th>Piloto</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="v : ${vehiculos}">
                        <td data-label="Matrícula" th:text="${v.matricula}">MAT</td>
                        <td data-label="Marca" th:text="${v.marca}">Marca</td>
                        <td data-label="Modelo" th:text="${v.modelo}">Modelo</td>
                        <td data-label="Categoría" th:text="${v.categoria}">Cat</td>
                        <td data-label="Piloto"
                            th:text="${v.piloto != null ? v.piloto.nombre + ' ' + v.piloto.apellidos : '—'}">Piloto</td>
                        <td data-label="Acciones">
                            <div class="facv-table-actions">
                                <a class="facv-btn-secondary" th:href="@{/vehiculos/{m}/editar(m=${v.matricula})}">Editar</a>
                                <form th:action="@{/vehiculos/{m}/eliminar(m=${v.matricula})}" method="post">
                                    <button class="facv-btn-danger" type="submit">Eliminar</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script th:src="@{/js/facv-toasts.js}"></script>
</body>
</html>
