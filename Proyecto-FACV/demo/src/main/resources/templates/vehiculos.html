<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Vehículos</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="app-shell">
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <main class="page">
        <section class="hero">
            <p class="eyebrow">Vehículos</p>
            <h1>Listado de vehículos</h1>
            <p>Lista de vehículos disponibles en el sistema.</p>
            <div>
                <a class="nav-link" th:href="@{/nuevo-vehiculo}">Añadir vehículo</a>
            </div>
        </section>

        <section class="page-section">
            <form method="post" th:action="@{/findByMarca}" th:object="${searchForm}">
                Buscar por marca:
                <div class="field">
                    <input type="text" th:field="*{marca}" placeholder="Ingrese marca del vehículo" />
                    <input type="submit" value="Buscar" />
                </div>
            </form>
        </section>

        <section class="page-section">
            <div class="auth-message" th:if="${successMessage}" th:text="${successMessage}"></div>
            <div class="content-grid vehiculos-grid">
                <div th:if="${#lists.isEmpty(vehiculos)}">
                    <p>No hay vehículos aún.</p>
                </div>
                <div th:each="v : ${vehiculos}">
                    <article class="card panel">
                        <h3 th:text="${v.matricula}">Matrícula</h3>
                        <p><strong>Marca:</strong> <span th:text="${v.marca}">Marca</span></p>
                        <p><strong>Modelo:</strong> <span th:text="${v.modelo}">Modelo</span></p>
                        <p><strong>Categoría:</strong> <span th:text="${v.categoria}">Categoría</span></p>
                        <p><strong>Piloto:</strong> <span th:text="${v.piloto != null ? v.piloto.nombre + ' ' + v.piloto.apellidos : 'Sin piloto'}">Piloto</span></p>
                        <div style="display:flex; gap:0.5rem; margin-top:0.8rem; flex-wrap:wrap;">
                            <a class="nav-link" th:href="@{/vehiculos/{m}/editar(m=${v.matricula})}">Editar</a>
                            <form th:action="@{/vehiculos/{m}/eliminar(m=${v.matricula})}" method="post" style="margin:0;">
                                <button class="logout-button" type="submit">Eliminar</button>
                            </form>
                        </div>
                    </article>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
