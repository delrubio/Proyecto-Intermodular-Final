<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inscripciones</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="app-shell">
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <main class="page">
        <section class="hero">
            <div class="hero-text">
                <p class="eyebrow">Inscripciones</p>
                <h1>Inscripciones en pruebas</h1>
                <p>Registro de vehículos participantes en cada prueba.</p>
            </div>
            <div class="hero-actions" th:if="${isAdmin or userRol == 'PILOTO'}">
                <a class="facv-btn-secondary" th:href="@{/nueva-inscripcion}">+ Nueva inscripción</a>
            </div>
        </section>

        <div th:if="${#lists.isEmpty(inscripciones)}" class="card panel">
            <p>No hay inscripciones registradas.</p>
        </div>

        <div class="facv-table-wrapper" th:unless="${#lists.isEmpty(inscripciones)}">
            <table class="facv-table">
                <thead>
                    <tr>
                        <th>Prueba</th>
                        <th>Vehículo</th>
                        <th>Piloto</th>
                        <th>Verificado</th>
                        <th>Apto</th>
                        <th th:if="${isAdmin}">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="i : ${inscripciones}">
                        <td data-label="Prueba" th:text="${i.prueba.nombre}">Prueba</td>
                        <td data-label="Vehículo"
                            th:text="${i.vehiculo.marca + ' ' + i.vehiculo.modelo + ' (' + i.vehiculo.matricula + ')'}">Vehículo</td>
                        <td data-label="Piloto"
                            th:text="${i.vehiculo.piloto != null ? i.vehiculo.piloto.nombre + ' ' + i.vehiculo.piloto.apellidos : '—'}">Piloto</td>
                        <td data-label="Verificado">
                            <span class="facv-badge"
                                  th:classappend="${i.verificado ? 'facv-badge-si' : 'facv-badge-no'}"
                                  th:text="${i.verificado ? 'Sí' : 'No'}">No</span>
                        </td>
                        <td data-label="Apto">
                            <span class="facv-badge"
                                  th:classappend="${i.apto == null ? 'facv-badge-pendiente' : (i.apto ? 'facv-badge-apto' : 'facv-badge-no-apto')}"
                                  th:text="${i.apto == null ? 'Pendiente' : (i.apto ? 'Apto' : 'No apto')}">—</span>
                        </td>
                        <td data-label="Acciones" th:if="${isAdmin}">
                            <form th:action="@{/inscripciones/eliminar}" method="post">
                                <input type="hidden" name="matricula" th:value="${i.id.matricula}">
                                <input type="hidden" name="pruebaId" th:value="${i.id.idPrueba}">
                                <button class="facv-btn-danger" type="submit">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script th:src="@{/js/facv-toasts.js}"></script>
</body>
</html>
