<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva inscripción</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="app-shell">
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <main class="page">
        <section class="hero">
            <div class="hero-text">
                <p class="eyebrow">Inscripciones</p>
                <h1>Nueva inscripción</h1>
                <p>Selecciona el vehículo y la prueba.</p>
            </div>
        </section>

        <div class="card panel" style="max-width:680px;">
            <form th:action="@{/nueva-inscripcion}" method="post">
                <div class="field-row">
                    <div class="field">
                        <label for="matricula">Vehículo *</label>
                        <select id="matricula" name="matricula" required>
                            <option value="">— Selecciona vehículo —</option>
                            <option th:each="v : ${vehiculos}"
                                    th:value="${v.matricula}"
                                    th:text="${v.marca + ' ' + v.modelo + ' - ' + v.matricula}">
                            </option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="pruebaId">Prueba *</label>
                        <select id="pruebaId" name="pruebaId" required>
                            <option value="">— Selecciona prueba —</option>
                            <option th:each="p : ${pruebas}"
                                    th:value="${p.idPrueba}"
                                    th:text="${p.nombre + ' (' + #temporals.format(p.fecha, 'dd/MM/yyyy') + ')'}">
                            </option>
                        </select>
                    </div>
                </div>

                <div class="facv-form-actions">
                    <button class="facv-btn-primary" type="submit">Inscribir</button>
                    <a class="facv-btn-neutral" th:href="@{/inscripciones}">Cancelar</a>
                </div>
            </form>
        </div>
    </main>

    <script th:src="@{/js/facv-toasts.js}"></script>
</body>
</html>
