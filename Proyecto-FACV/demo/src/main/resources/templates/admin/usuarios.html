<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="app-shell">
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <main class="page">
        <section class="hero">
            <p class="eyebrow">Administración</p>
            <h1>Gestión de usuarios</h1>
            <p>Panel de administración de todos los usuarios del sistema.</p>
            <div style="margin-top:1rem;">
                <a class="nav-link" th:href="@{/admin/usuarios/nuevo}">+ Nuevo usuario</a>
            </div>
        </section>

        <section class="page-section">
            <div class="auth-message" th:if="${successMessage}" th:text="${successMessage}"></div>
            <div class="auth-message" th:if="${errorMessage}" th:text="${errorMessage}" style="color:#ef5b2a;"></div>

            <!-- Filtros -->
            <article class="card panel" style="margin-bottom:1.5rem;">
                <form th:action="@{/admin/usuarios}" method="get" style="display:flex; gap:1rem; flex-wrap:wrap; align-items:flex-end;">
                    <div class="field" style="flex:1; min-width:180px;">
                        <label for="busqueda">Buscar</label>
                        <input id="busqueda" type="text" name="busqueda"
                               placeholder="Nombre, apellidos, email, licencia..."
                               th:value="${busqueda}" />
                    </div>
                    <div class="field" style="flex:0 0 160px;">
                        <label for="rol">Rol</label>
                        <select id="rol" name="rol">
                            <option value="">Todos los roles</option>
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"
                                    th:selected="${r.name() == rolFiltro}">
                            </option>
                        </select>
                    </div>
                    <div>
                        <button class="login-button" type="submit">Filtrar</button>
                        <a class="nav-link" th:href="@{/admin/usuarios}" style="margin-left:0.5rem;">Limpiar</a>
                    </div>
                </form>
            </article>

            <!-- Tabla de usuarios -->
            <div th:if="${#lists.isEmpty(usuarios)}">
                <p>No se encontraron usuarios.</p>
            </div>

            <article class="card panel" th:unless="${#lists.isEmpty(usuarios)}" style="overflow-x:auto;">
                <table style="width:100%; border-collapse:collapse; font-size:0.9rem;">
                    <thead>
                        <tr style="text-align:left; border-bottom:1px solid rgba(255,255,255,0.1);">
                            <th style="padding:0.6rem 0.8rem;">Licencia</th>
                            <th style="padding:0.6rem 0.8rem;">Nombre</th>
                            <th style="padding:0.6rem 0.8rem;">Apellidos</th>
                            <th style="padding:0.6rem 0.8rem;">Email</th>
                            <th style="padding:0.6rem 0.8rem;">Rol</th>
                            <th style="padding:0.6rem 0.8rem;">Localidad</th>
                            <th style="padding:0.6rem 0.8rem;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${usuarios}"
                            style="border-bottom:1px solid rgba(255,255,255,0.05);">
                            <td style="padding:0.6rem 0.8rem;" th:text="${u.licencia ?: '—'}">LIC</td>
                            <td style="padding:0.6rem 0.8rem;" th:text="${u.nombre}">Nombre</td>
                            <td style="padding:0.6rem 0.8rem;" th:text="${u.apellidos}">Apellidos</td>
                            <td style="padding:0.6rem 0.8rem;" th:text="${u.email}">Email</td>
                            <td style="padding:0.6rem 0.8rem;">
                                <span th:text="${u.rol}" style="font-weight:600;"></span>
                            </td>
                            <td style="padding:0.6rem 0.8rem;" th:text="${u.localidad ?: '—'}">Localidad</td>
                            <td style="padding:0.6rem 0.8rem; display:flex; gap:0.4rem; flex-wrap:wrap;">
                                <a class="nav-link" th:href="@{/admin/usuarios/{lic}/editar(lic=${u.licencia})}">Editar</a>
                                <form th:action="@{/admin/usuarios/{lic}/eliminar(lic=${u.licencia})}" method="post" style="margin:0;"
                                      onsubmit="return confirm('¿Eliminar usuario ' + /*[[${u.nombre}]]*/ '' + '? Esta acción no se puede deshacer.')">
                                    <button class="logout-button" type="submit">Eliminar</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </article>
        </section>
    </main>
</body>
</html>
