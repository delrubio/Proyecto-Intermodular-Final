<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de Usuarios</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="app-shell">
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <main class="page">
        <section class="hero">
            <div class="hero-text">
                <p class="eyebrow">Administración</p>
                <h1>Gestión de usuarios</h1>
                <p>Panel de administración de todos los usuarios del sistema.</p>
            </div>
            <div class="hero-actions">
                <a class="facv-btn-primary" th:href="@{/admin/usuarios/nuevo}">+ Nuevo usuario</a>
            </div>
        </section>

        <form th:action="@{/admin/usuarios}" method="get">
            <div class="facv-search-bar">
                <div class="facv-search-input-group">
                    <label class="facv-search-label">Buscar</label>
                    <input type="text" class="facv-input" name="busqueda"
                           placeholder="Nombre, apellidos, email, licencia..."
                           th:value="${busqueda}">
                </div>
                <div class="facv-search-filter-group">
                    <label class="facv-search-label">Rol</label>
                    <select class="facv-select" name="rol">
                        <option value="">Todos los roles</option>
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"
                                th:selected="${r.name() == rolFiltro}">
                        </option>
                    </select>
                </div>
                <div class="facv-search-actions">
                    <button type="submit" class="facv-btn-primary">Filtrar</button>
                    <a class="facv-btn-neutral" th:href="@{/admin/usuarios}">Limpiar</a>
                </div>
            </div>
        </form>

        <div th:if="${#lists.isEmpty(usuarios)}" class="card panel">
            <p>No se encontraron usuarios.</p>
        </div>

        <div class="facv-table-wrapper" th:unless="${#lists.isEmpty(usuarios)}">
            <table class="facv-table">
                <thead>
                    <tr>
                        <th>Licencia</th>
                        <th>Nombre</th>
                        <th>Apellidos</th>
                        <th>Email</th>
                        <th>Rol</th>
                        <th>Localidad</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td data-label="Licencia" th:text="${u.licencia ?: '—'}">LIC</td>
                        <td data-label="Nombre" th:text="${u.nombre}">Nombre</td>
                        <td data-label="Apellidos" th:text="${u.apellidos}">Apellidos</td>
                        <td data-label="Email" th:text="${u.email}">Email</td>
                        <td data-label="Rol">
                            <span class="facv-badge facv-badge-revision" th:text="${u.rol}">ROL</span>
                        </td>
                        <td data-label="Localidad" th:text="${u.localidad ?: '—'}">Localidad</td>
                        <td data-label="Acciones">
                            <div class="facv-table-actions">
                                <a class="facv-btn-secondary"
                                   th:href="@{/admin/usuarios/{lic}/editar(lic=${u.licencia})}">Editar</a>
                                <form th:action="@{/admin/usuarios/{lic}/eliminar(lic=${u.licencia})}" method="post"
                                      th:data-nombre="${u.nombre}"
                                      onsubmit="return confirm('¿Eliminar usuario ' + this.dataset.nombre + '? Esta acción no se puede deshacer.')">
                                    <button class="facv-btn-danger" type="submit">Eliminar</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script th:src="@{/js/facv-toasts.js}"></script>
</body>
</html>
