<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head> 
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="app-shell">
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <main class="page">
        <section class="hero">
            <div class="hero-text">
                <p class="eyebrow">Automovilismo FACV</p>
                <h1>Usuarios</h1>
                <p>Gestión de usuarios registrados y permisos.</p>
            </div>
        </section>

        <form method="post" th:action="@{/findByName}" th:object="${searchForm}">
            <div class="facv-search-bar">
                <div class="facv-search-input-group">
                    <label class="facv-search-label">Buscar por nombre</label>
                    <input type="text" class="facv-input" th:field="*{nombre}" placeholder="Nombre de usuario...">
                </div>
                <div class="facv-search-actions">
                    <button type="submit" class="facv-btn-secondary">Buscar</button>
                </div>
            </div>
        </form>

        <div th:if="${#lists.isEmpty(usuarios)}" class="card panel">
            <p>No hay usuarios.</p>
        </div>

        <div class="facv-table-wrapper" th:unless="${#lists.isEmpty(usuarios)}">
            <table class="facv-table">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Rol</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td data-label="Nombre" th:text="${u.nombre}">Nombre</td>
                        <td data-label="Email" th:text="${u.email}">email</td>
                        <td data-label="Rol">
                            <span class="facv-badge facv-badge-revision" th:text="${u.rol}">ROL</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script th:src="@{/js/facv-toasts.js}"></script>
div>
        </section>
    </main>
</body>
</html>
