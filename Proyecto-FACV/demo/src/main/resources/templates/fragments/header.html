<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <header th:fragment="siteHeader" class="topbar">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark">FACV</span>
            <span class="brand-text">Rallye Manager</span>
        </a>

        <nav class="nav">
            <a class="nav-link" th:href="@{/}">Inicio</a>

            <!-- ADMINISTRADOR: acceso total -->
            <th:block th:if="${userRol == 'ADMINISTRADOR'}">
                <a class="nav-link" th:href="@{/pruebas}">Pruebas</a>
                <a class="nav-link" th:href="@{/vehiculos}">Vehículos</a>
                <a class="nav-link" th:href="@{/verificaciones}">Verificaciones</a>
                <a class="nav-link" th:href="@{/inscripciones}">Inscripciones</a>
                <a class="nav-link" th:href="@{/informes}">Informes</a>
                <a class="nav-link" th:href="@{/admin/usuarios}">Usuarios</a>
            </th:block>

            <!-- ORGANIZADOR: pruebas + inscripciones (ver) -->
            <th:block th:if="${userRol == 'ORGANIZADOR'}">
                <a class="nav-link" th:href="@{/pruebas}">Pruebas</a>
                <a class="nav-link" th:href="@{/inscripciones}">Inscripciones</a>
            </th:block>

            <!-- PILOTO: vehículos, pruebas, inscripciones -->
            <th:block th:if="${userRol == 'PILOTO'}">
                <a class="nav-link" th:href="@{/vehiculos}">Vehículos</a>
                <a class="nav-link" th:href="@{/pruebas}">Pruebas</a>
                <a class="nav-link" th:href="@{/inscripciones}">Inscripciones</a>
            </th:block>

            <!-- TECNICO: flujo verificación -->
            <th:block th:if="${userRol == 'TECNICO'}">
                <a class="nav-link" th:href="@{/verificaciones}">Verificaciones</a>
            </th:block>

            <!-- OBSERVADOR: pruebas, verificaciones, informes -->
            <th:block th:if="${userRol == 'OBSERVADOR'}">
                <a class="nav-link" th:href="@{/pruebas}">Pruebas</a>
                <a class="nav-link" th:href="@{/verificaciones}">Verificaciones</a>
                <a class="nav-link" th:href="@{/informes}">Informes</a>
            </th:block>
        </nav>

        <form class="logout-form" th:action="@{/logout}" method="post">
            <button type="submit" class="logout-button">Salir</button>
        </form>
    </header>
</body>
</html>
