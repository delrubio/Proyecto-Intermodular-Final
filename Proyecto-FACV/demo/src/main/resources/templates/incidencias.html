<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Incidencias</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="app-shell">
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <main class="page">
        <section class="hero">
            <p class="eyebrow">Incidencias</p>
            <h1 th:text="${vehiculo != null ? 'Incidencias — ' + vehiculo.marca + ' ' + vehiculo.modelo + ' (' + vehiculo.matricula + ')' : 'Incidencias técnicas'}">Incidencias técnicas</h1>
            <p th:text="${vehiculo != null ? 'Registro de incidencias detectadas para este vehículo.' : 'Registro global de incidencias activas.'}"></p>
            <div style="display:flex; gap:0.8rem; flex-wrap:wrap; margin-top:1rem; align-items:center;">
                <a class="nav-link" th:href="@{/verificaciones}">← Volver a verificaciones</a>
            </div>
        </section>

        <section class="page-section">
            <div class="auth-message" th:if="${successMessage}" th:text="${successMessage}"></div>
            <div class="auth-message" th:if="${errorMessage}" th:text="${errorMessage}" style="color:#ef5b2a;"></div>

            <div th:if="${#lists.isEmpty(incidencias)}">
                <p>No hay incidencias registradas.</p>
            </div>

            <div class="content-grid">
                <div th:each="inc : ${incidencias}">
                    <article class="card panel">
                        <h3 th:text="${inc.vehiculo.marca + ' ' + inc.vehiculo.modelo + ' (' + inc.vehiculo.matricula + ')'}">Vehículo</h3>
                        <p><strong>Prueba:</strong> <span th:text="${inc.verificacion != null and inc.verificacion.prueba != null ? inc.verificacion.prueba.nombre : '—'}"></span></p>
                        <p><strong>Técnico:</strong> <span th:text="${inc.tecnico1.nombre + ' ' + inc.tecnico1.apellidos}"></span></p>
                        <p><strong>Descripción:</strong> <span th:text="${inc.descripcionIncidencia}"></span></p>
                        <p><strong>Estado:</strong> <span th:text="${inc.estado}"></span></p>
                        <p><strong>Fecha:</strong> <span th:text="${#temporals.format(inc.fecha, 'dd/MM/yyyy')}"></span></p>
                        <div th:if="${isAdmin or userRol == 'TECNICO'}" style="display:flex; gap:0.5rem; margin-top:0.8rem; flex-wrap:wrap;">
                            <a class="nav-link" th:href="@{/incidencias/{id}/editar(id=${inc.id})}">Editar</a>
                            <form th:action="@{/incidencias/{id}/eliminar(id=${inc.id})}" method="post" style="margin:0;">
                                <button class="logout-button" type="submit">Eliminar</button>
                            </form>
                        </div>
                    </article>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
