<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Incidencias</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="app-shell">
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <main class="page">
        <section class="hero">
            <div class="hero-text">
                <p class="eyebrow">Incidencias</p>
                <h1 th:text="${vehiculo != null ? 'Incidencias — ' + vehiculo.marca + ' ' + vehiculo.modelo + ' (' + vehiculo.matricula + ')' : 'Incidencias técnicas'}">Incidencias técnicas</h1>
                <p th:text="${vehiculo != null ? 'Registro de incidencias detectadas para este vehículo.' : 'Registro global de incidencias activas.'}"></p>
            </div>
            <div class="hero-actions">
                <a class="facv-btn-neutral" th:href="@{/verificaciones}">← Volver a verificaciones</a>
            </div>
        </section>

        <div th:if="${#lists.isEmpty(incidencias)}" class="card panel">
            <p>No hay incidencias registradas.</p>
        </div>

        <div class="facv-table-wrapper" th:unless="${#lists.isEmpty(incidencias)}">
            <table class="facv-table">
                <thead>
                    <tr>
                        <th>Vehículo</th>
                        <th>Prueba</th>
                        <th>Técnico</th>
                        <th>Descripción</th>
                        <th>Estado</th>
                        <th>Fecha</th>
                        <th th:if="${isAdmin or userRol == 'TECNICO'}">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="inc : ${incidencias}">
                        <td data-label="Vehículo"
                            th:text="${inc.vehiculo.marca + ' ' + inc.vehiculo.modelo + ' (' + inc.vehiculo.matricula + ')'}">Vehículo</td>
                        <td data-label="Prueba"
                            th:text="${inc.verificacion != null and inc.verificacion.prueba != null ? inc.verificacion.prueba.nombre : '—'}">Prueba</td>
                        <td data-label="Técnico"
                            th:text="${inc.tecnico1.nombre + ' ' + inc.tecnico1.apellidos}">Técnico</td>
                        <td data-label="Descripción" th:text="${inc.descripcionIncidencia}">Descripción</td>
                        <td data-label="Estado">
                            <span class="facv-badge"
                                  th:classappend="${inc.estado != null and inc.estado.name() == 'ABIERTA' ? 'facv-badge-abierta' :
                                                   (inc.estado != null and inc.estado.name() == 'EN_REVISION' ? 'facv-badge-revision' :
                                                   (inc.estado != null and inc.estado.name() == 'RESUELTA' ? 'facv-badge-resuelta' : 'facv-badge-pendiente'))}"
                                  th:text="${inc.estado}">Estado</span>
                        </td>
                        <td data-label="Fecha"
                            th:text="${#temporals.format(inc.fecha, 'dd/MM/yyyy')}">Fecha</td>
                        <td data-label="Acciones" th:if="${isAdmin or userRol == 'TECNICO'}">
                            <div class="facv-table-actions">
                                <a class="facv-btn-secondary"
                                   th:href="@{/incidencias/{id}/editar(id=${inc.id})}">Editar</a>
                                <form th:action="@{/incidencias/{id}/eliminar(id=${inc.id})}" method="post">
                                    <button class="facv-btn-danger" type="submit">Eliminar</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script th:src="@{/js/facv-toasts.js}"></script>
</body>
</html>
