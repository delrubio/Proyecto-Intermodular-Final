<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verificaciones</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="app-shell">
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <main class="page">
        <section class="hero">
            <div class="hero-text">
                <p class="eyebrow">Verificaciones</p>
                <h1>Verificaciones técnicas</h1>
                <p>Control técnico de vehículos antes de las pruebas.</p>
            </div>
            <div class="hero-actions">
                <a class="facv-btn-primary"
                   th:if="${userRol == 'TECNICO'}"
                   th:href="@{/verificaciones/seleccionar-prueba}">+ Nueva verificación</a>
                <a class="facv-btn-secondary"
                   th:if="${isAdmin}"
                   th:href="@{/nueva-verificacion}">+ Nueva (admin)</a>
            </div>
        </section>

        <div th:if="${#lists.isEmpty(verificaciones)}" class="card panel">
            <p>No hay verificaciones registradas.</p>
        </div>

        <div class="facv-table-wrapper" th:unless="${#lists.isEmpty(verificaciones)}">
            <table class="facv-table">
                <thead>
                    <tr>
                        <th>Vehículo</th>
                        <th>Prueba</th>
                        <th>Técnico 1</th>
                        <th>Técnico 2</th>
                        <th>Resultado</th>
                        <th>Fecha</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="v : ${verificaciones}">
                        <td data-label="Vehículo"
                            th:text="${v.vehiculo.marca + ' ' + v.vehiculo.modelo + ' (' + v.vehiculo.matricula + ')'}">Vehículo</td>
                        <td data-label="Prueba" th:text="${v.prueba.nombre}">Prueba</td>
                        <td data-label="Técnico 1"
                            th:text="${v.tecnico1.nombre + ' ' + v.tecnico1.apellidos}">Técnico</td>
                        <td data-label="Técnico 2"
                            th:text="${v.tecnico2 != null ? v.tecnico2.nombre + ' ' + v.tecnico2.apellidos : '—'}">—</td>
                        <td data-label="Resultado">
                            <span th:if="${v.resultado != null}" class="facv-badge"
                                  th:classappend="${v.resultado.name() == 'APTO' ? 'facv-badge-apto' : 'facv-badge-no-apto'}"
                                  th:text="${v.resultado}">—</span>
                            <span th:unless="${v.resultado != null}" class="facv-badge facv-badge-pendiente">Pendiente</span>
                        </td>
                        <td data-label="Fecha"
                            th:text="${#temporals.format(v.fecha, 'dd/MM/yyyy')}">Fecha</td>
                        <td data-label="Acciones">
                            <div class="facv-table-actions">
                                <a class="facv-btn-neutral"
                                   th:if="${v.resultado != null and v.resultado.name() == 'NO_APTO'}"
                                   th:href="@{/incidencias(matricula=${v.vehiculo.matricula})}">Incidencias</a>
                                <a class="facv-btn-secondary"
                                   th:if="${isAdmin or userRol == 'TECNICO'}"
                                   th:href="@{/verificaciones/{id}/editar(id=${v.id})}">Editar</a>
                                <form th:if="${isAdmin or userRol == 'TECNICO'}"
                                      th:action="@{/verificaciones/{id}/eliminar(id=${v.id})}" method="post">
                                    <button class="facv-btn-danger" type="submit">Eliminar</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script th:src="@{/js/facv-toasts.js}"></script>
</body>
</html>
