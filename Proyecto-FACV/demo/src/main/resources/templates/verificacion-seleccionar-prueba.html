<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Seleccionar Prueba</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="app-shell">
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <main class="page">
        <section class="hero">
            <div class="hero-text">
                <p class="eyebrow">Verificaciones · Paso 1 de 2</p>
                <h1>Selecciona la prueba</h1>
                <p>Elige la prueba cuyos vehículos deseas verificar.</p>
            </div>
        </section>

        <div class="card panel" style="max-width:560px;">
            <form th:action="@{/verificaciones/seleccionar-prueba}" method="post">
                <div class="field">
                    <label for="pruebaId">Prueba *</label>
                    <select id="pruebaId" name="pruebaId" required>
                        <option value="">— Selecciona una prueba —</option>
                        <option th:each="p : ${pruebas}"
                                th:value="${p.idPrueba}"
                                th:text="${p.nombre + ' — ' + #temporals.format(p.fecha, 'dd/MM/yyyy') + ' (' + (p.localidad ?: '') + ')'}">
                        </option>
                    </select>
                </div>
                <div class="facv-form-actions">
                    <button class="facv-btn-secondary" type="submit">Ver vehículos pendientes →</button>
                    <a class="facv-btn-neutral" th:href="@{/verificaciones}">Cancelar</a>
                </div>
            </form>
        </div>
    </main>

    <script th:src="@{/js/facv-toasts.js}"></script>
</body>
</html>
