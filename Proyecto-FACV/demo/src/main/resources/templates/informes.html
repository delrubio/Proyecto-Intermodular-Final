<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Informes</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="app-shell">
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <main class="page">
        <section class="hero">
            <div class="hero-text">
                <p class="eyebrow">Informes</p>
                <h1>Informes de prueba</h1>
                <p>Documentación técnica generada tras cada prueba.</p>
            </div>
            <div class="hero-actions" th:if="${userRol == 'OBSERVADOR'}">
                <a class="facv-btn-primary" th:href="@{/nuevo-informe}">+ Nuevo informe</a>
            </div>
        </section>

        <div th:if="${#lists.isEmpty(informes)}" class="card panel">
            <p>No hay informes registrados.</p>
        </div>

        <div class="facv-table-wrapper" th:unless="${#lists.isEmpty(informes)}">
            <table class="facv-table">
                <thead>
                    <tr>
                        <th>Prueba</th>
                        <th>Observador</th>
                        <th>Fecha</th>
                        <th>Puntuación</th>
                        <th>Contenido</th>
                        <th th:if="${isAdmin}">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="inf : ${informes}">
                        <td data-label="Prueba" th:text="${inf.prueba.nombre}">Prueba</td>
                        <td data-label="Observador"
                            th:text="${inf.observador.nombre + ' ' + inf.observador.apellidos}">Observador</td>
                        <td data-label="Fecha"
                            th:text="${#temporals.format(inf.fecha, 'dd/MM/yyyy')}">Fecha</td>
                        <td data-label="Puntuación" th:text="${inf.puntuacionFinal}">0.0</td>
                        <td data-label="Contenido"
                            th:text="${#strings.abbreviate(inf.contenido ?: '', 80)}">Contenido</td>
                        <td data-label="Acciones" th:if="${isAdmin}">
                            <div class="facv-table-actions">
                                <a class="facv-btn-secondary"
                                   th:href="@{/informes/{id}/editar(id=${inf.id})}">Editar</a>
                                <form th:action="@{/informes/{id}/eliminar(id=${inf.id})}" method="post">
                                    <button class="facv-btn-danger" type="submit">Eliminar</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script th:src="@{/js/facv-toasts.js}"></script>
</body>
</html>
