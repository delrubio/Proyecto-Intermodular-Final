<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Informes</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="app-shell">
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <main class="page">
        <section class="hero">
            <p class="eyebrow">Informes</p>
            <h1>Informes de prueba</h1>
            <p>Documentación técnica generada tras cada prueba.</p>
            <div th:if="${userRol == 'OBSERVADOR'}">
                <a class="nav-link" th:href="@{/nuevo-informe}">Nuevo informe</a>
            </div>
        </section>

        <section class="page-section">
            <div class="auth-message" th:if="${successMessage}" th:text="${successMessage}"></div>
            <div class="auth-message" th:if="${errorMessage}" th:text="${errorMessage}" style="color:#ef5b2a;"></div>

            <div th:if="${#lists.isEmpty(informes)}">
                <p>No hay informes registrados.</p>
            </div>

            <div class="content-grid">
                <div th:each="inf : ${informes}">
                    <article class="card panel">
                        <h3 th:text="${inf.prueba.nombre}">Prueba</h3>
                        <p><strong>Observador:</strong> <span th:text="${inf.observador.nombre + ' ' + inf.observador.apellidos}"></span></p>
                        <p><strong>Fecha:</strong> <span th:text="${#temporals.format(inf.fecha, 'dd/MM/yyyy')}"></span></p>
                        <p><strong>Puntuación:</strong> <span th:text="${inf.puntuacionFinal}"></span></p>
                        <p><strong>Contenido:</strong></p>
                        <p th:text="${#strings.abbreviate(inf.contenido ?: '', 200)}"></p>
                        <div th:if="${isAdmin}" style="display:flex; gap:0.5rem; margin-top:0.8rem; flex-wrap:wrap;">
                            <a class="nav-link" th:href="@{/informes/{id}/editar(id=${inf.id})}">Editar</a>
                            <form th:action="@{/informes/{id}/eliminar(id=${inf.id})}" method="post" style="margin:0;">
                                <button class="logout-button" type="submit">Eliminar</button>
                            </form>
                        </div>
                    </article>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
