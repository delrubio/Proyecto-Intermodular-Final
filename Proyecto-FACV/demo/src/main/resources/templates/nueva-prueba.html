<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${formTitle}">Prueba</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="app-shell">
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <main class="page">
        <section class="hero">
            <div class="hero-text">
                <p class="eyebrow">Pruebas</p>
                <h1 th:text="${formTitle}">Crear nueva prueba</h1>
                <p>Rellena los datos de la prueba.</p>
            </div>
        </section>

        <div th:if="${prueba.imagenFilename != null}" class="facv-prueba-banner">
            <img th:src="@{/pruebas/imagen/{id}(id=${prueba.idPrueba})}"
                 class="facv-prueba-banner-img" alt="Imagen de cabecera">
        </div>

        <div class="card panel" style="max-width:680px;">
            <form th:action="${formAction}" th:object="${prueba}" method="post" enctype="multipart/form-data">

                <div class="field">
                    <label for="nombre">Nombre *</label>
                    <input id="nombre" type="text" th:field="*{nombre}" required>
                    <small class="field-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></small>
                </div>

                <div class="field-row">
                    <div class="field">
                        <label for="fecha">Fecha *</label>
                        <input id="fecha" type="date" th:field="*{fecha}" required>
                        <small class="field-error" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}"></small>
                    </div>
                    <div class="field">
                        <label for="localidad">Localidad</label>
                        <input id="localidad" type="text" th:field="*{localidad}">
                    </div>
                </div>

                <div class="field">
                    <label for="campeonato">Campeonato</label>
                    <input id="campeonato" type="text" th:field="*{campeonato}">
                </div>

                <div class="field" th:if="${isAdmin}">
                    <label for="organizadorLicencia">Organizador</label>
                    <select id="organizadorLicencia" name="organizadorLicencia">
                        <option value="">— Selecciona organizador —</option>
                        <option th:each="o : ${organizadores}"
                                th:value="${o.licencia}"
                                th:text="${o.nombre + ' ' + o.apellidos}"
                                th:selected="${prueba.organizador != null and prueba.organizador.licencia == o.licencia}">
                        </option>
                    </select>
                </div>

                <div class="field">
                    <label for="imagenFile">Imagen de cabecera</label>
                    <input id="imagenFile" type="file" name="file" accept="image/*" class="facv-input">
                    <small th:if="${prueba.imagenFilename != null}" style="color: var(--facv-text-muted);">
                        Ya hay una imagen. Selecciona otra para reemplazarla.
                    </small>
                </div>

                <div th:if="${#fields.hasGlobalErrors()}" class="field-error">
                    <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                </div>

                <div class="facv-form-actions">
                    <button class="facv-btn-primary" type="submit" th:text="${submitLabel}">Guardar</button>
                    <a class="facv-btn-neutral" th:href="@{/pruebas}">Cancelar</a>
                </div>
            </form>
        </div>
    </main>

    <script th:src="@{/js/facv-toasts.js}"></script>
</body>
</html>
