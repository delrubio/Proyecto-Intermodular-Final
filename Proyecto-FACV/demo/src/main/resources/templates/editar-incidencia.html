<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${formTitle}">Editar incidencia</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="app-shell">
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <main class="page">
        <section class="hero">
            <p class="eyebrow">Incidencias</p>
            <h1 th:text="${formTitle}">Editar incidencia</h1>
        </section>

        <section class="page-section">
            <article class="card panel">
                <!-- Información de solo lectura -->
                <div style="margin-bottom:1rem; padding:0.8rem; background:rgba(255,255,255,0.05); border-radius:6px;">
                    <p><strong>Vehículo:</strong>
                        <span th:text="${incidencia.vehiculo.marca + ' ' + incidencia.vehiculo.modelo + ' (' + incidencia.vehiculo.matricula + ')'}"></span>
                    </p>
                    <p><strong>Técnico:</strong>
                        <span th:text="${incidencia.tecnico1.nombre + ' ' + incidencia.tecnico1.apellidos}"></span>
                    </p>
                    <p><strong>Fecha:</strong>
                        <span th:text="${#temporals.format(incidencia.fecha, 'dd/MM/yyyy')}"></span>
                    </p>
                </div>

                <form th:action="${formAction}" method="post">
                    <div class="field">
                        <label for="descripcionIncidencia">Descripción *</label>
                        <textarea id="descripcionIncidencia" name="descripcionIncidencia" rows="4" required
                                  th:text="${incidencia.descripcionIncidencia}"></textarea>
                    </div>

                    <div class="field">
                        <label for="estado">Estado *</label>
                        <select id="estado" name="estado" required>
                            <option value="ABIERTA">ABIERTA</option>
                            <option value="EN_REVISION">EN_REVISION</option>
                            <option value="RESUELTA">RESUELTA</option>
                        </select>
                    </div>

                    <div style="margin-top:1rem">
                        <button class="login-button" type="submit" th:text="${submitLabel}">Guardar cambios</button>
                        <a class="nav-link" th:href="@{/incidencias}" style="margin-left:0.8rem;">Cancelar</a>
                    </div>
                </form>
            </article>
        </section>
    </main>
</body>
</html>
