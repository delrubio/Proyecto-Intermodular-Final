<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Incidencias</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="app-shell">
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <main class="page">
        <section class="hero">
            <div class="hero-text">
                <p class="eyebrow">Incidencias</p>
                <h1>Incidencias automáticas</h1>
                <p>Las incidencias se generan automáticamente al registrar una verificación técnica con resultado NO_APTO.</p>
            </div>
            <div class="hero-actions">
                <a class="facv-btn-secondary" th:href="@{/verificaciones}">Ir a verificaciones</a>
                <a class="facv-btn-neutral" th:href="@{/incidencias}">Ver incidencias</a>
            </div>
        </section>
    </main>

    <script th:src="@{/js/facv-toasts.js}"></script>
</body>
</html>
